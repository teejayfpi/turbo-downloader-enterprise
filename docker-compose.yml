services:
  turbo-downloader:
    build: .
    image: turbo-downloader:latest
    container_name: turbo-downloader
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      TURBO_DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      CORS_ORIGIN: "*"
    volumes:
      - turbo-data:/data
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  turbo-data:
