# Fly.io config — deploy with: fly launch --no-deploy && fly deploy
# Then create a volume: fly volumes create turbo_data --size 1
app = "turbo-downloader"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  TURBO_DATA_DIR = "/data"
  DOWNLOAD_DIR = "/downloads"
  CORS_ORIGIN = "*"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Persistent disk for the SQLite database and downloaded files.
# Create with: fly volumes create turbo_data --size 3
[[mounts]]
  source = "turbo_data"
  destination = "/data"

[[mounts]]
  source = "turbo_data"
  destination = "/downloads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
