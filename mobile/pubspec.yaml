name: turbo_downloader
description: "Turbo — enterprise download manager for Android."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon-512.png
    - assets/icon/icon-maskable-512.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon-512.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/icon-maskable-512.png"
