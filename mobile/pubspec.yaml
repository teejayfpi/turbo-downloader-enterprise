name: turbo_downloader
description: "Turbo — offline-first download manager for Android and desktop."
publish_to: 'none'
version: 2.1.0+6

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  provider: ^6.1.2
  youtube_explode_dart: ^3.1.0
  # Receive links from anywhere: deep links / "Open with" intents on every
  # platform, the Android share sheet, and desktop drag-and-drop.
  # app_links is pinned to 6.3.x: 6.4+ reads `flutter.compileSdkVersion` in its
  # Android Gradle script, which the Flutter 3.24 Gradle template does not
  # expose.
  app_links: ">=6.3.0 <6.4.0"
  receive_sharing_intent: ^1.8.1
  desktop_drop: ^0.5.0
  # Opens external links from the app, e.g. the designer's WhatsApp chat.
  url_launcher: ^6.3.0
  # SHA-256 fingerprints for credentials, checksums, and release verification.
  crypto: ^3.0.3
  # Bundled FFmpeg, used to merge the separate video and audio tracks that
  # YouTube serves above 360p. The `min` build keeps H.264/AAC and the MP4
  # muxer without the encoders we never use, so the APK stays small.
  ffmpeg_kit_flutter_new_min: ^3.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  # Used by media_extractor_test.dart to build canned stream metadata.
  http_parser: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon-512.png
    - assets/icon/icon-maskable-512.png

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon-512.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/icon-maskable-512.png"
  windows:
    generate: true
    image_path: "assets/icon/icon-512.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon-512.png"

# youtube_explode_dart 3.1.0 needs path >=1.9.1, but the Flutter 3.24.5 SDK's
# flutter_test still pins path 1.9.0. The override lifts that single transitive
# pin; the extractor and the test harness both work with path 1.9.1.
dependency_overrides:
  path: ^1.9.1
