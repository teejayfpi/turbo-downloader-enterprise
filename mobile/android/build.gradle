allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Keep every plugin module on Java 17. Some plugins compile their Kotlin to 17
// while Flutter leaves the Java target at 1.8, which trips Gradle's "jvm target
// compatibility" check (e.g. receive_sharing_intent). This must be registered
// before the evaluationDependsOn below, which forces plugin modules to
// evaluate; an afterEvaluate added afterwards runs too late and AGP has already
// finalized compileOptions.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            if (subproject.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
                subproject.android.kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
