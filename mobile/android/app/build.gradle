plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is supplied out-of-band so the keystore never lands in git.
// A release build refuses to run without it: the debug key is public, so an
// APK signed with it can be impersonated by anyone (including the in-app
// updater's checksum-wrapped download). Debug builds are unaffected.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowDebugSigning = project.hasProperty("allowDebugSigning") ||
    System.getenv("ALLOW_DEBUG_SIGNING") == "true"
def buildingRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (buildingRelease && !hasReleaseKeystore && !allowDebugSigning) {
    throw new GradleException(
        "Release signing is not configured. Create android/key.properties " +
        "with storeFile/storePassword/keyAlias/keyPassword, or pass " +
        "-PallowDebugSigning=true for a throwaway local build (never distribute it)."
    )
}

android {
    namespace = "com.turbodl.turbo_downloader"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.turbodl.turbo_downloader"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Play requires a single APK per ABI or a bundle; a bundle is built by
    // default with `flutter build appbundle`.
    bundle {
        language {
            enableSplit = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider, used to hand a finished file to the share sheet as a
    // content:// URI without exposing storage.
    implementation "androidx.core:core-ktx:1.13.1"
}
