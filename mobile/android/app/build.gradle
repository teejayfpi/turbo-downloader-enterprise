plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is supplied out-of-band so the keystore never lands in git.
// A release build refuses to run without it: the debug key is public, so an
// APK signed with it can be impersonated by anyone (including the in-app
// updater's checksum-wrapped download). Debug builds are unaffected.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowDebugSigning = project.hasProperty("allowDebugSigning") ||
    System.getenv("ALLOW_DEBUG_SIGNING") == "true"
def buildingRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (buildingRelease && !hasReleaseKeystore && !allowDebugSigning) {
    throw new GradleException(
        "Release signing is not configured. Create android/key.properties " +
        "with storeFile/storePassword/keyAlias/keyPassword, or pass " +
        "-PallowDebugSigning=true for a throwaway local build (never distribute it)."
    )
}

android {
    namespace = "com.turbodl.turbo_downloader"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.turbodl.turbo_downloader"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // youtubedl-android ships CPython, ffmpeg, and quickjs as .so files that
        // are unpacked to the app's lib dir at runtime and executed as
        // programs. Building for one ABI keeps the APK from carrying four
        // copies of a ~40 MB interpreter; Play splits by ABI for a bundle, and
        // a local/CI APK only ever runs on the device that installs it.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Play requires a single APK per ABI or a bundle; a bundle is built by
    // default with `flutter build appbundle`.
    bundle {
        language {
            enableSplit = false
        }
    }

    // The embedded engine's .so files (libpython, libffmpeg, libqjs) are
    // unpacked to the native library dir and executed, which needs them
    // extractable on install. Legacy packaging stores them compressed, which
    // keeps the APK smaller than shipping them uncompressed and aligned.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider, used to hand a finished file to the share sheet as a
    // content:// URI without exposing storage.
    implementation "androidx.core:core-ktx:1.13.1"

    // Embedded yt-dlp for Android: this bundles CPython, yt-dlp, ffmpeg, and
    // quickjs as native libraries so the app can run the full extractor
    // on-device, with no external binary to install. It is GPL-3.0, which is
    // why this repository is licensed GPL-3.0 as a whole (see LICENSE).
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
