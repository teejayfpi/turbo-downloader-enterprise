<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="Turbo — an enterprise-grade download manager. Multi-connection, resumable, blazing fast." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turbo" />
    <meta property="og:title" content="Turbo — Blazing Fast Download Manager" />
    <meta property="og:description" content="Enterprise-grade download manager. Multi-connection, resumable, and built for speed." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <title>Turbo — Download Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; background: #07090f; }
      /* First-paint splash: shown before React mounts, then replaced by <SplashScreen>. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background:
          radial-gradient(120% 80% at 50% 26%, rgba(34,224,255,.14), transparent 62%),
          linear-gradient(180deg,#0a0e18 0%,#07090f 48%,#04060b 100%);
        font-family: Sora, system-ui, sans-serif; color: #8b95ab;
      }
      #boot-splash .b-wrap { display:flex; flex-direction:column; align-items:center; text-align:center; }
      #boot-splash .b-mark { width: 132px; height: 132px; animation: b-pop .8s cubic-bezier(.16,1,.3,1) both; }
      #boot-splash .b-word {
        margin-top: 24px; font-family: 'Chakra Petch', sans-serif;
        font-size: 46px; font-weight: 700; letter-spacing: .34em; padding-left: .34em;
        background: linear-gradient(180deg,#fff,#cfefff 58%,#7fe4ff);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: b-rise .8s cubic-bezier(.16,1,.3,1) .08s both;
      }
      #boot-splash .b-tag {
        margin-top: 8px; font-family: 'JetBrains Mono', monospace;
        font-size: 10px; font-weight: 500; letter-spacing: .42em; padding-left: .42em;
        color: rgba(34,224,255,.85); animation: b-rise .8s cubic-bezier(.16,1,.3,1) .16s both;
      }
      #boot-splash .b-credit { margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .08em; color: rgba(240,244,252,.72); }
      #boot-splash .b-rail { margin-top: 38px; width: 260px; max-width: 62vw; height: 3px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; position: relative; }
      #boot-splash .b-rail i { position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: 999px;
        background: linear-gradient(90deg, rgba(34,224,255,0), #2fffc8 60%, #22e0ff); animation: b-load 1.5s ease-in-out infinite; }
      @keyframes b-pop { 0%{opacity:0;transform:scale(.76)} 60%{opacity:1;transform:scale(1.03)} 100%{opacity:1;transform:scale(1)} }
      @keyframes b-rise { 0%{opacity:0;transform:translateY(18px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes b-load { 0%{left:-42%} 100%{left:100%} }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .b-mark, #boot-splash .b-word, #boot-splash .b-tag, #boot-splash .b-rail i { animation: none !important; }
        #boot-splash .b-rail i { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Turbo Downloader is starting">
        <div class="b-wrap">
          <svg class="b-mark" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <linearGradient id="bm" x1="0.1" y1="0.05" x2="0.9" y2="1">
                <stop offset="0" stop-color="#8af8ff"/><stop offset="0.42" stop-color="#22e0ff"/><stop offset="1" stop-color="#2fffc8"/>
              </linearGradient>
            </defs>
            <path d="M566 176 L334 548 H484 L430 848 L690 466 H536 Z" fill="url(#bm)"/>
          </svg>
          <div class="b-word">TURBO</div>
          <div class="b-tag">ENTERPRISE DOWNLOAD OPERATIONS</div>
          <div class="b-rail"><i></i></div>
          <div class="b-credit">designed by: Ayanlowo Olatunji Ayobami</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
