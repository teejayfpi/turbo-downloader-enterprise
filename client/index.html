<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Turbo — an enterprise-grade download manager. Multi-connection, resumable, blazing fast." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turbo" />
    <meta property="og:title" content="Turbo — Blazing Fast Download Manager" />
    <meta property="og:description" content="Enterprise-grade download manager. Multi-connection, resumable, and built for speed." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <title>Turbo - Blazing Fast Download Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; background: #05060a; }
      /* First-paint splash: shown before React mounts, then replaced by <SplashScreen>. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(120% 80% at 50% 30%, rgba(31,216,255,.16), transparent 60%),
                    linear-gradient(180deg,#0b1020 0%,#07080f 45%,#030409 100%);
        font-family: Inter, system-ui, sans-serif; color: #93a0b8;
      }
      #boot-splash .b-mark { width: 150px; height: 150px; animation: b-pop .9s cubic-bezier(.16,1,.3,1) both; }
      #boot-splash .b-arc { transform-origin: 512px 512px; animation: b-spin 3.6s linear infinite; }
      #boot-splash .b-word {
        margin-top: 26px; font-size: 56px; font-weight: 800; letter-spacing: .22em;
        padding-left: .22em; text-align: center;
        background: linear-gradient(180deg,#fff,#cfefff 55%,#8fe6ff);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        animation: b-rise .9s cubic-bezier(.16,1,.3,1) .1s both;
      }
      #boot-splash .b-tag { margin-top: 10px; font-size: 13px; font-weight: 600; letter-spacing: .34em; color: rgba(0,212,255,.9); animation: b-rise .9s cubic-bezier(.16,1,.3,1) .2s both; }
      #boot-splash .b-rail { margin-top: 42px; width: 280px; max-width: 60vw; height: 5px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
      #boot-splash .b-rail i { position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: 999px;
        background: linear-gradient(90deg, rgba(0,212,255,0), #00ffc2 60%, #00d4ff); animation: b-load 1.6s ease-in-out infinite; }
      @keyframes b-pop { 0%{opacity:0;transform:scale(.72)} 60%{opacity:1;transform:scale(1.04)} 100%{opacity:1;transform:scale(1)} }
      @keyframes b-spin { from{transform:rotate(-140deg)} to{transform:rotate(220deg)} }
      @keyframes b-rise { 0%{opacity:0;transform:translateY(22px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes b-load { 0%{left:-42%} 100%{left:100%} }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .b-mark, #boot-splash .b-arc, #boot-splash .b-word, #boot-splash .b-tag, #boot-splash .b-rail i { animation: none !important; }
        #boot-splash .b-rail i { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Turbo Downloader is starting">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
          <svg class="b-mark" viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <linearGradient id="bm" x1="0.1" y1="0.05" x2="0.9" y2="1">
                <stop offset="0" stop-color="#7af6ff"/><stop offset="0.42" stop-color="#00d4ff"/><stop offset="1" stop-color="#00ffc2"/>
              </linearGradient>
              <linearGradient id="ba" x1="0.1" y1="0" x2="0.9" y2="1">
                <stop offset="0" stop-color="#5ef2ff" stop-opacity="0.6"/><stop offset="1" stop-color="#00ffc2" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <circle class="b-arc" cx="512" cy="512" r="340" fill="none" stroke="url(#ba)" stroke-width="26" stroke-linecap="round" pathLength="100" stroke-dasharray="64 36" transform="rotate(-140 512 512)"/>
            <path d="M462 258H562V534H688L512 736L336 534H462Z" fill="url(#bm)"/>
          </svg>
          <div class="b-word">TURBO</div>
          <div class="b-tag">DOWNLOAD MANAGER</div>
          <div class="b-rail"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
