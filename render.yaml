# Render blueprint — deploys Turbo Downloader as a Docker web service.
# Persistent disks keep the SQLite database and downloaded files across deploys.
# https://render.com/docs/blueprint-spec
#
# Note: persistent disks require a paid instance type (Starter or above).
# Render injects its own PORT; the app reads process.env.PORT automatically.
services:
  - type: web
    name: turbo-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURBO_DATA_DIR
        value: /data
      - key: DOWNLOAD_DIR
        value: /downloads
      # CORS_ORIGIN must be your real client origin (comma-separated for
      # several). Leaving it unset allows anonymous cross-origin reads only;
      # setting it to "*" alongside credentials would let any site read
      # authenticated responses, so it is deliberately not defaulted to "*".
      # - key: CORS_ORIGIN
      #   value: https://your-app.example.com
      # The API is public on Render. Require a token (Render generates one on
      # first blueprint sync; reveal it in the dashboard) and make an
      # unauthenticated boot fatal. Clients present it as
      # `Authorization: Bearer <token>`, `X-Api-Token`, or `?token=`.
      - key: TURBO_API_TOKEN
        generateValue: true
      - key: TURBO_REQUIRE_TOKEN
        value: "true"
    disks:
      - name: turbo-data
        mountPath: /data
        sizeGB: 1
      - name: turbo-downloads
        mountPath: /downloads
        sizeGB: 10
