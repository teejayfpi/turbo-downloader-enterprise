# Render blueprint — deploys Turbo Downloader as a Docker web service.
# Persistent disks keep the SQLite database and downloaded files across deploys.
# https://render.com/docs/blueprint-spec
#
# Note: persistent disks require a paid instance type (Starter or above).
# Render injects its own PORT; the app reads process.env.PORT automatically.
services:
  - type: web
    name: turbo-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURBO_DATA_DIR
        value: /data
      - key: DOWNLOAD_DIR
        value: /downloads
      - key: CORS_ORIGIN
        value: "*"
    disks:
      - name: turbo-data
        mountPath: /data
        sizeGB: 1
      - name: turbo-downloads
        mountPath: /downloads
        sizeGB: 10
