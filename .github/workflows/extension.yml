name: Browser extension

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/extension.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('browser-extension/manifest.json','utf8')); console.log('manifest ok')"

      - name: Syntax-check scripts
        run: |
          for f in $(find browser-extension -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
            echo "$f ok"
          done

      - name: Unit tests
        run: cd browser-extension && node --test

      - name: Lint the Firefox manifest (web-ext)
        run: |
          set -e
          rm -rf /tmp/ext-ff
          mkdir -p /tmp/ext-ff
          cp -r browser-extension/. /tmp/ext-ff/
          cp /tmp/ext-ff/manifest.firefox.json /tmp/ext-ff/manifest.json
          rm -f /tmp/ext-ff/manifest.firefox.json
          npx --yes web-ext lint --source-dir /tmp/ext-ff --output json > /tmp/lint.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/lint.json'))
          errs = d.get('errors', [])
          for e in errs:
              print('ERROR', e.get('code'), '-', e.get('message'))
          if errs:
              raise SystemExit('web-ext lint reported errors')
          print('web-ext lint: 0 errors')
          PY

  # Produces loadable builds. GitHub always wraps artifacts in a zip, so the
  # artifacts here are the UNPACKED extension directories: extracting the
  # downloaded artifact once yields a folder whose top level is manifest.json,
  # which is what "Load unpacked" needs. Store-ready zips (a zip of those same
  # files) are uploaded separately, because stores want a zip, not a folder.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage unpacked Chrome and Firefox builds
        run: |
          set -e
          files="background.js content.js popup.html popup.js icons lib"
          rm -rf dist && mkdir -p dist/chrome dist/firefox
          cp browser-extension/manifest.json dist/chrome/manifest.json
          cp browser-extension/manifest.firefox.json dist/firefox/manifest.json
          for d in chrome firefox; do
            for f in $files; do cp -r "browser-extension/$f" "dist/$d/"; done
          done
          # Store-ready zips (zip of the same files, manifest.json at the root).
          (cd dist/chrome  && zip -qr "$GITHUB_WORKSPACE/turbo-browser-extension.zip" .)
          (cd dist/firefox && zip -qr "$GITHUB_WORKSPACE/turbo-browser-extension-firefox.zip" .)
          sha256sum turbo-browser-extension.zip turbo-browser-extension-firefox.zip > turbo-browser-extension.sha256

      - name: Verify manifest is at each zip's root
        run: |
          set -e
          for z in turbo-browser-extension.zip turbo-browser-extension-firefox.zip; do
            unzip -l "$z" | grep -qE '^\s+[0-9]+\s+.*\smanifest\.json$' \
              || { echo "::error::manifest.json is not at the root of $z"; exit 1; }
            echo "$z: manifest at root"
          done

      # Extract the downloaded artifact once and this folder IS the extension.
      - uses: actions/upload-artifact@v7
        with:
          name: turbo-browser-extension
          path: dist/chrome
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: turbo-browser-extension-firefox
          path: dist/firefox
          if-no-files-found: error

      # For store submission (Chrome Web Store / Edge / AMO) and checksums.
      - uses: actions/upload-artifact@v7
        with:
          name: turbo-browser-extension-store-zips
          path: |
            turbo-browser-extension.zip
            turbo-browser-extension-firefox.zip
            turbo-browser-extension.sha256
          if-no-files-found: error
