name: Desktop build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: turbo-linux
            bundle: mobile/build/linux/x64/release/bundle
          # windows-2022 ships the VS2022 C++ workload; windows-latest (2025)
          # no longer lets Flutter's VS discovery find it, so pin to 2022.
          - os: windows-2022
            target: windows
            artifact: turbo-windows
            bundle: mobile/build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: turbo-macos
            bundle: mobile/build/macos/Build/Products/Release/Turbo.app

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev patchelf

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      # ---------------------------------------------------------------- Windows
      # Wrap the raw bundle in a single-file installer so it can be downloaded
      # and installed on a laptop without a toolchain.
      - name: Install Inno Setup
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $clean = ($v -split '\+')[0].Trim()
          "value=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        if: matrix.target == 'windows'
        working-directory: mobile/windows/installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" turbo.iss
          Copy-Item "dist\TurboSetup-${{ steps.version.outputs.value }}.exe" "dist\TurboSetup-windows.exe" -Force

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: turbo-windows-installer
          path: mobile/windows/installer/dist/TurboSetup-windows.exe
          if-no-files-found: error

      # --------------------------------------------------------- Release archives
      # Produce a stable-named archive per platform for the release job to attach.
      - name: Package Linux archive
        if: matrix.target == 'linux'
        working-directory: mobile/build/linux/x64/release/bundle
        run: tar czf "$GITHUB_WORKSPACE/mobile/Turbo-linux.tar.gz" .

      - name: Package macOS archive
        if: matrix.target == 'macos'
        working-directory: mobile/build/macos/Build/Products/Release
        run: zip -qry "$GITHUB_WORKSPACE/mobile/Turbo-macos.zip" Turbo.app

      - name: Upload release archive
        if: matrix.target != 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: turbo-release-${{ matrix.target }}
          path: |
            mobile/Turbo-${{ matrix.target }}.${{ matrix.target == 'linux' && 'tar.gz' || 'zip' }}
          if-no-files-found: error

  # Publish from a single job so the three platforms do not race to create the
  # same release. Missing platforms (a failed build) are simply omitted.
  release:
    needs: build
    # Publish whatever built successfully. A single platform failing (e.g. an
    # unsigned vendored framework on macOS) must not hold back the Windows
    # installer and Linux archive for everyone else.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(awk -F'[+ ]' '/^version:/{print $2}' mobile/pubspec.yaml)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      # The in-app updater verifies the asset it downloads against a published
      # manifest and refuses to install when none covers it, so every release
      # must carry one.
      - name: Write checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum \
            turbo-windows-installer/TurboSetup-windows.exe \
            turbo-release-macos/Turbo-macos.zip \
            turbo-release-linux/Turbo-linux.tar.gz 2>/dev/null \
            | sed 's# .*/# #' > SHA256SUMS.desktop || true
          cat SHA256SUMS.desktop

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Turbo Downloader v${{ steps.version.outputs.value }}
          # Publish the platforms that built; skip any that failed so one
          # platform can't block the others from shipping.
          fail_on_unmatched_files: false
          files: |
            artifacts/turbo-windows-installer/TurboSetup-windows.exe
            artifacts/turbo-release-macos/Turbo-macos.zip
            artifacts/turbo-release-linux/Turbo-linux.tar.gz
            artifacts/SHA256SUMS.desktop
