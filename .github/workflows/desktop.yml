name: Desktop build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: turbo-linux
            bundle: mobile/build/linux/x64/release/bundle
          # windows-2022 ships the VS2022 C++ workload; windows-latest (2025)
          # no longer lets Flutter's VS discovery find it, so pin to 2022.
          - os: windows-2022
            target: windows
            artifact: turbo-windows
            bundle: mobile/build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: turbo-macos
            bundle: mobile/build/macos/Build/Products/Release/Turbo.app

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      # ---------------------------------------------------------------- Windows
      # Wrap the raw bundle in a single-file installer so it can be downloaded
      # and installed on a laptop without a toolchain.
      - name: Install Inno Setup
        if: matrix.target == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $clean = ($v -split '\+')[0].Trim()
          "value=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        if: matrix.target == 'windows'
        working-directory: mobile/windows/installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" turbo.iss

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: turbo-windows-installer
          path: mobile/windows/installer/dist/*.exe
          if-no-files-found: error

      # ----------------------------------------------------------- Release assets
      # On a main push, attach installers to the release matching the version so
      # the download links are stable (…/releases/latest/download/…).
      - name: Zip macOS app
        if: matrix.target == 'macos'
        working-directory: mobile/build/macos/Build/Products/Release
        run: |
          zip -qry Turbo-macos.zip Turbo.app

      - name: Stage release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p release-assets
          case "${{ matrix.target }}" in
            windows) cp windows/installer/dist/*.exe release-assets/TurboSetup-windows.exe ;;
            macos)   cp build/macos/Build/Products/Release/Turbo-macos.zip release-assets/Turbo-macos.zip ;;
            linux)   (cd build/linux/x64/release/bundle && zip -qry ../../../../../../release-assets/Turbo-linux.zip .) ;;
          esac

      - name: Publish release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Turbo Downloader v${{ steps.version.outputs.value }}
          fail_on_unmatched_files: false
          files: release-assets/*

