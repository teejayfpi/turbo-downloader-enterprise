name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release builds are signed when these repository secrets are set:
      #   ANDROID_KEYSTORE_BASE64  base64 of the .jks file
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
      # Without them the build still succeeds with the debug key, which is
      # installable for testing but not accepted by Play.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets set; release build will use the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/turbo-release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$PWD/android/app/turbo-release.jks"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: turbo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: turbo-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Attach the APK to the GitHub release for this version, so the in-app
      # updater (which reads release assets) can find and install it on Android.
      # Runs only on a main push; a PR build just produces artifacts.
      - name: Attach APK to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk -F'[+ ]' '/^version:/{print $2}' pubspec.yaml)
          tag="v$version"
          cp build/app/outputs/flutter-apk/app-release.apk Turbo-android.apk
          # The in-app updater verifies the APK against a published manifest and
          # refuses to install when none covers it, so ship one with the APK.
          sha256sum Turbo-android.apk > SHA256SUMS.android
          # The release may not exist yet if this job raced the desktop release
          # job; create it if needed, then upload (replacing any stale APK).
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "Turbo Downloader $tag" --generate-notes
          gh release upload "$tag" Turbo-android.apk SHA256SUMS.android \
            --repo "$GITHUB_REPOSITORY" --clobber
