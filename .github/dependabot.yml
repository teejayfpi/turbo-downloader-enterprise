# Automated dependency and action updates.
#
# Security fixes are the point: a vulnerable transitive package or a pinned
# action should be patched by a reviewable pull request, not discovered later.
# Grouped weekly so the volume stays reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: '/mobile'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # flutter_lints 6 needs Dart 3.8; the app targets Dart 3.5. Lift this when
      # the Flutter SDK baseline moves.
      - dependency-name: flutter_lints
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns: ['*']

  - package-ecosystem: npm
    directory: '/client'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client:
        patterns: ['*']
