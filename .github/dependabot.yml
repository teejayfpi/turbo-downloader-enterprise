# Automated dependency and action updates.
#
# Security fixes are the point: a vulnerable transitive package or a pinned
# action should be patched by a reviewable pull request, not discovered later.
# Grouped weekly so the volume stays reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: '/mobile'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # A bump whose package needs a newer Dart SDK than the app's 3.5 baseline
      # (and the pinned Flutter 3.24.5) cannot resolve, so the PR turns every
      # build red at `flutter pub get`. `flutter_lints` and `app_links` gate
      # that on a major release; the rest ship it in a minor or patch, so every
      # update type is ignored for them (omitting `update-types` ignores all).
      # Lift an entry when the SDK baseline moves.
      - dependency-name: flutter_lints
        update-types: ['version-update:semver-major']
      - dependency-name: app_links
        update-types: ['version-update:semver-major']
      - dependency-name: shared_preferences
      - dependency-name: shared_preferences_platform_interface
      - dependency-name: path_provider
      - dependency-name: path_provider_platform_interface
      - dependency-name: url_launcher
      - dependency-name: receive_sharing_intent
      - dependency-name: desktop_drop
      - dependency-name: ffmpeg_kit_flutter_new_min

  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns: ['*']

  - package-ecosystem: npm
    directory: '/client'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client:
        patterns: ['*']
